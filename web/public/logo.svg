<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Chetya">
  <defs>
    <linearGradient id="chetya-gold" x1="24" y1="16" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2dc7a"/>
      <stop offset="0.45" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8a6b18"/>
    </linearGradient>
    <linearGradient id="chetya-face" x1="64" y1="12" x2="64" y2="116">
      <stop stop-color="#18181f"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <radialGradient id="chetya-glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rounded tile -->
  <rect width="128" height="128" rx="30" fill="url(#chetya-face)"/>
  <rect width="128" height="128" rx="30" fill="url(#chetya-glow)"/>
  <!-- Outer wheel -->
  <circle cx="64" cy="64" r="46" stroke="url(#chetya-gold)" stroke-width="2.25" opacity="0.92"/>
  <circle cx="64" cy="64" r="38" stroke="url(#chetya-gold)" stroke-width="1" opacity="0.22"/>
  <!-- House / division ticks (chart metaphor) -->
  <g stroke="url(#chetya-gold)" stroke-width="1.25" stroke-linecap="round" opacity="0.38">
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(0 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(30 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(60 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(90 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(120 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(150 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(180 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(210 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(240 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(270 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(300 64 64)"/>
    <line x1="64" y1="64" x2="64" y2="26" transform="rotate(330 64 64)"/>
  </g>
  <!-- Inner orbit -->
  <circle cx="64" cy="64" r="22" stroke="url(#chetya-gold)" stroke-width="1.5" opacity="0.55"/>
  <!-- Center bindu -->
  <circle cx="64" cy="64" r="5.5" fill="url(#chetya-gold)"/>
  <circle cx="64" cy="64" r="2.2" fill="#fff9e6" opacity="0.55"/>
</svg>
